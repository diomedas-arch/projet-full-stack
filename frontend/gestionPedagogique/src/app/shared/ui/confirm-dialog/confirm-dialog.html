<h2 mat-dialog-title>{{ data.titre }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button class="button button-secondary" type="button" (click)="annuler()">
    {{ data.libelleAnnuler ?? 'Annuler' }}
  </button>
  <button class="button button-danger" type="button" (click)="confirmer()">
    {{ data.libelleConfirmer ?? 'Supprimer' }}
  </button>
</mat-dialog-actions>
