<div class="page">
  <header class="page-header">
    <h1>Promotions</h1>
    <a mat-flat-button color="primary" routerLink="/promotions/nouveau">
      <mat-icon>add</mat-icon>
      Nouvelle promotion
    </a>
  </header>

  <mat-chip-listbox class="filtres-statut" [value]="filtreStatut()" (change)="onFiltreChange($event)">
    @for (filtre of filtres; track filtre.valeur) {
      <mat-chip-option [value]="filtre.valeur">{{ filtre.label }}</mat-chip-option>
    }
  </mat-chip-listbox>

  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort class="table">
      <ng-container matColumnDef="libelle">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Libellé</th>
        <td mat-cell *matCellDef="let p">{{ p.libelle }}</td>
      </ng-container>

      <ng-container matColumnDef="cursus">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Cursus</th>
        <td mat-cell *matCellDef="let p">{{ p.titreCursus }}</td>
      </ng-container>

      <ng-container matColumnDef="periode">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Période</th>
        <td mat-cell *matCellDef="let p" class="mono">{{ p.periode }}</td>
      </ng-container>

      <ng-container matColumnDef="statut">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Statut</th>
        <td mat-cell *matCellDef="let p"><app-statut-badge [statut]="p.statut" /></td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
        <td mat-cell *matCellDef="let p" class="actions-cell">
          <a mat-icon-button [routerLink]="['/promotions', p.idPromotion, 'modifier']" aria-label="Modifier">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button (click)="supprimer(p)" aria-label="Supprimer">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    @if (promotionsFiltrees().length === 0) {
      <p class="etat-vide">Aucune promotion ne correspond à ce filtre.</p>
    }
  </div>
</div>
