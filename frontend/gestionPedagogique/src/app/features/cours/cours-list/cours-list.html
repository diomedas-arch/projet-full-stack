<div class="page">
  <header class="page-header">
    <h1>Cours</h1>
    <a class="button button-primary" routerLink="/cours/nouveau">Nouveau cours</a>
  </header>

  <mat-form-field appearance="outline" class="recherche">
    <mat-label>Rechercher</mat-label>
    <input
      matInput
      placeholder="Code ou titre..."
      [value]="recherche()"
      (input)="onRecherche($any($event.target).value)"
    />
  </mat-form-field>

  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort class="table">
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th>
        <td mat-cell *matCellDef="let c" class="mono">{{ c.code }}</td>
      </ng-container>

      <ng-container matColumnDef="titre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Titre</th>
        <td mat-cell *matCellDef="let c">{{ c.titre }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
        <td mat-cell *matCellDef="let c" class="actions-cell">
          <a class="button button-small button-secondary" [routerLink]="['/cours', c.id]">Voir</a>
          <a class="button button-small button-secondary" [routerLink]="['/cours', c.id, 'modifier']">Modifier</a>
          <button class="button button-small button-danger" type="button" (click)="supprimer(c)">
            Supprimer
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    @if (coursFiltres().length === 0) {
      <p class="etat-vide">Aucun cours ne correspond à votre recherche.</p>
    }
  </div>
</div>
