<!doctype html>
<html lang="fr" ng-app="servicePedagogiqueApp">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>Connexion - Service pédagogique</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page" ng-controller="LoginController as vm" ng-cloak>
<main class="login-container">
    <section class="login-card" aria-labelledby="titre-connexion">
        <span class="badge">Service pédagogique</span>
        <h1 id="titre-connexion">Connexion</h1>
        <p>Connectez-vous pour accéder à votre espace pédagogique.</p>

        <form name="loginForm" ng-submit="vm.submit(loginForm)" novalidate>
            <div class="form-field">
                <label for="email">Email <span class="required">*</span></label>
                <input id="email" name="email" type="email" autocomplete="username" required
                       ng-model="vm.credentials.email" placeholder="votre.email@exemple.fr">
                <span class="field-error" ng-if="loginForm.$submitted && loginForm.email.$invalid">Saisissez un email valide.</span>
            </div>
            <div class="form-field">
                <label for="motDePasse">Mot de passe <span class="required">*</span></label>
                <input id="motDePasse" name="motDePasse" type="password" autocomplete="current-password" required
                       ng-model="vm.credentials.motDePasse" placeholder="Votre mot de passe">
                <span class="field-error" ng-if="loginForm.$submitted && loginForm.motDePasse.$invalid">Le mot de passe est obligatoire.</span>
            </div>
            <button class="button button-primary login-button" type="submit" ng-disabled="vm.loading">
                {{vm.loading ? 'Connexion en cours…' : 'Se connecter'}}
            </button>
        </form>
        <div class="form-message error" ng-if="vm.message" role="alert">{{vm.message}}</div>
    </section>
</main>
<script src="/webjars/angular/1.8.3/angular.min.js"></script>
<script src="/js/angular/app.js"></script>
<script src="/js/angular/pages.js"></script>
</body>
</html>
