plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'fr.servicepedagogique'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

def frontendDir = file('../frontend/gestionPedagogique')
def frontendDistDir = file("${frontendDir}/dist/gestion-pedagogique/browser")
def frontendStaticDir = layout.buildDirectory.dir('generated/frontend-static')
def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
def skipFrontend = providers.gradleProperty('skipFrontend').isPresent()

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('npmCi', Exec) {
	onlyIf { !skipFrontend }
	workingDir frontendDir
	commandLine npmCommand, 'ci'
}

tasks.register('npmBuild', Exec) {
	onlyIf { !skipFrontend }
	dependsOn tasks.named('npmCi')
	workingDir frontendDir
	commandLine npmCommand, 'run', 'build'
}

tasks.register('copyFrontend', Copy) {
	onlyIf { !skipFrontend }
	dependsOn tasks.named('npmBuild')
	from frontendDistDir
	into frontendStaticDir
}

tasks.named('bootJar') {
	if (!skipFrontend) {
		dependsOn tasks.named('copyFrontend')
		from(frontendStaticDir) {
			into 'BOOT-INF/classes/static'
		}
	}
}
